openapi: 3.0.3
info:
  title: "Сервис каталога групп с ролями администратора и публичной"
  description: "API для навигации и фильтрации категорий"
  version: 1.0.0
servers:
  - url: "https://marketplace.com/v1"
    description: Staging server
tags:
  - name: Catalog
    description: "Публичный доступ к каталогу для просмотра"
  - name: AdminCatalog
    description: "Доступ к каталогу для админа для создания, изменения и удаления"
paths:
  /categories:
    get:
      summary: "Получение всех корневых категорий первого уровня"
      tags:
        - Catalog
      parameters:
        - name: limit
          in: query
          required: false
          description: "Максимальное число строк для вывода на страницу за один раз"
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: "Смещение от начала списка"
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: is_active
          in: query
          required: false
          description: "Фильтрация для подкатегорий"
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          description: "Поиск по name (частичное совпадение, регистронезависимое)"
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: parent_id
          in: query
          required: false
          description: "Просмотр подкатегорий каталога"
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: "Получение всех корневых категорий первого уровня и получение подкатегорий определённой группы"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"

  /categories/tree:
    get:
      summary: "Получение полного дерева каталога (все категории и подкатегории в виде вложенной структуры)"
      tags:
        - Catalog
      responses:
        200:
          description: "Получение полного дерева каталога"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryTree"
          headers:
            Cache-Control:
              description: "Кэширование на стороне клиента на 1 час"
              schema:
                type: string
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"

  /admin/categories:
    post:
      summary: "Создание новой категории/подкатегории с parent_id"
      tags:
        - AdminCatalog
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          description: "Дедупликация при создании категории через использование ключа идемпотентности"
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      security:
        - bearerAuth: []
      responses:
        201:
          description: "Новая категория успешно создана"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        409:
          $ref: "#/components/responses/Conflict"
        500:
          $ref: "#/components/responses/InternalServerError"

  /admin/categories/{id}:
    patch:
      summary: "Редактирование категории"
      tags:
        - AdminCatalog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      security:
        - bearerAuth: []
      responses:
        200:
          description: "Категория успешно обновлена"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
        500:
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: "Удаление категории"
      tags:
        - AdminCatalog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        200:
          description: "категория успешно удалена"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Категория id 1 успешно удалена"
                required:
                  - status
                  - message
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: "Description of error response"
      required:
        - code
        - message

    Category:
      type: object
      required:
        - id
        - name
        - slug
        - is_active
        - display_order
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "Смартфоны"
        slug:
          type: string
          example: "smartphones"
        description:
          type: string
          example: "Краткое описание"
        parent_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174022"
        level:
          type: integer
          example: 1
        image_url:
          type: string
          example: "https://image.com"
        is_active:
          type: boolean
          example: true
        display_order:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2026-01-20T20:18:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-01-28T10:18:00Z"

    CategoryInput:
      type: object
      required:
        - name
        - slug
        - is_active
        - display_order
      properties:
        name:
          type: string
          example: "Компьютер"
        slug:
          type: string
          example: "computer"
        description:
          type: string
          example: "Краткое описание"
        parent_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174045"
        image_url:
          type: string
          example: "https://image.com"
        is_active:
          type: boolean
          example: true
        display_order:
          type: integer
          example: 1

    CategoryTree:
      allOf:
        - $ref: "#/components/schemas/Category"
      type: object
      properties:
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryTree"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
